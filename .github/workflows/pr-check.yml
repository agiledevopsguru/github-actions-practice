name: PR Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  pr-check:
    runs-on: ubuntu-latest

    steps:
      - name: Print PR branch
        run: |
          echo "Testing PR trigger" >> test.txt
          echo "PR check running for branch: ${{ github.head_ref }}"
          
