name: Ignore Documentation Changes

on:
  push:
    branches:
      - main
      - 'release/*'

    paths-ignore:
      - '*.md'
      - '**/*.md'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Build
        run: |
          echo "Workflow triggered!"
          echo "Changes include files other than ignored documentation."
